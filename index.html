<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Christmas Countdown</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10251d;
      color: #fff8e7;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main {
      padding: 2rem;
    }

    #countdown {
      font-size: clamp(1.4rem, 5vw, 2.4rem);
      font-weight: 700;
      margin: 0.5rem 0 1rem;
    }

    #tree {
      display: inline-block;
      margin: 0;
      padding: 1rem;
      color: #71d18a;
      font: bold clamp(1rem, 4vw, 1.5rem)/1.15 monospace;
      text-align: left;
      white-space: pre;
      cursor: crosshair;
      user-select: none;
    }

    #tree span {
      display: inline-block;
      width: 1ch;
      text-align: center;
    }

    button {
      padding: 0.6rem 1rem;
      border: 0;
      border-radius: 0.5rem;
      background: #f5d76e;
      color: #213328;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: #ffe99a;
    }

    .hint {
      color: #c9d8cc;
    }
  </style>
</head>
<body>
  <main>
    <h1>Christmas Countdown</h1>
    <div id="countdown" aria-live="polite"></div>

    <pre id="tree" aria-label="Click the tree to decorate it"></pre>

    <p class="hint">Click a spot on the tree to add an ornament.</p>
    <button id="clear">Clear tree</button>
  </main>

  <script>
    const tree = document.querySelector("#tree");
    const countdown = document.querySelector("#countdown");
    const clearButton = document.querySelector("#clear");

    const rows = [
      "       *       ",
      "      ***      ",
      "     *****     ",
      "    *******    ",
      "   *********   ",
      "  ***********  ",
      " ************* ",
      "***************",
      "      |||      ",
      "      |||      "
    ];

    const ornaments = new Map();
    const colors = ["🔴", "🟡", "🔵", "🟣", "⚪"];
    let nextColor = 0;

    function drawTree() {
      tree.replaceChildren();

      rows.forEach((row, rowIndex) => {
        for (let column = 0; column < row.length; column++) {
          const key = `${rowIndex},${column}`;
          const character = row[column];
          const cell = document.createElement("span");

          cell.textContent = ornaments.get(key) || character;
          cell.dataset.key = key;

          if (ornaments.has(key)) {
            cell.style.color = "inherit";
          }

          tree.appendChild(cell);
        }

        if (rowIndex < rows.length - 1) {
          tree.appendChild(document.createTextNode("\n"));
        }
      });
    }

    tree.addEventListener("click", event => {
      const key = event.target.dataset.key;
      if (!key || rows[Number(key.split(",")[0])].includes("|")) return;

      ornaments.set(key, colors[nextColor % colors.length]);
      nextColor++;
      drawTree();
    });

    clearButton.addEventListener("click", () => {
      ornaments.clear();
      nextColor = 0;
      drawTree();
    });

    function updateCountdown() {
      const now = new Date();
      let christmas = new Date(now.getFullYear(), 11, 25);

      if (now >= christmas) {
        christmas = new Date(now.getFullYear() + 1, 11, 25);
      }

      const remaining = christmas - now;
      const days = Math.floor(remaining / 86_400_000);
      const hours = Math.floor((remaining / 3_600_000) % 24);
      const minutes = Math.floor((remaining / 60_000) % 60);
      const seconds = Math.floor((remaining / 1_000) % 60);

      countdown.textContent =
        `${days} days ${hours} hours ${minutes} minutes ${seconds} seconds`;
    }

    drawTree();
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
